<script>
const defaults=[{id:1,name:'Asad',brand:'Lattafa',ml:'100 ml',family:'Amaderada / especiada',notes:'Especias · maderas · ámbar · vainilla',gender:'Masculino / unisex',duration:'Alta',desc:'Fragancia intensa y especiada, de carácter elegante y envolvente.',image:''},{id:2,name:'Khamrah',brand:'Lattafa',ml:'100 ml',family:'Ámbar / gourmand',notes:'Canela · dátiles · praliné · vainilla · ámbar',gender:'Unisex',duration:'Alta',desc:'Dulce, cálido y gourmand.',image:''},{id:3,name:'Yara',brand:'Lattafa',ml:'100 ml',family:'Floral / gourmand',notes:'Frutas · flores · vainilla · almizcle',gender:'Femenino',duration:'Media-alta',desc:'Dulce, cremoso y femenino.',image:''},{id:4,name:'Afeef',brand:'Lattafa',ml:'100 ml',family:'Floral / frutal',notes:'Frutas · flores · vainilla · maderas',gender:'Unisex',duration:'Alta',desc:'Una fragancia sofisticada y envolvente.',image:''}];
let products=JSON.parse(localStorage.getItem('santinoProducts')||'null')||defaults,brand='';
let sortMode='default';const grid=document.getElementById('grid'),search=document.getElementById('search');function persist(){localStorage.setItem('santinoProducts',JSON.stringify(products))}function render(){
  let q=search.value.toLowerCase();

  let a=products.filter(p=>
    (p.name+' '+p.brand+' '+(p.notes||'')+' '+(p.desc||'')).toLowerCase().includes(q) &&
    (!brand||p.brand===brand)
  );
  if(sortMode==='newest') a.sort((x,y)=>new Date(y.created_at||0)-new Date(x.created_at||0));
  if(sortMode==='oldest') a.sort((x,y)=>new Date(x.created_at||0)-new Date(y.created_at||0));

  grid.innerHTML=a.map(p=>`<article class="card"><div class="pic">${p.image?`<img src="${p.image}" loading="lazy">`:'<div class="placeholder">🧴<br>Sin foto</div>'}</div><div class="body"><div class="brand">${p.brand}</div><div class="name">${p.name}</div><div class="ml">${p.ml}</div><button class="btn detail" onclick="show('${p.id}')">VER DETALLES →</button></div></article>`).join('')||'<p>No encontramos productos.</p>'}function setBrand(b){brand=b;render();document.getElementById('catalogo').scrollIntoView({behavior:'smooth'})}function clearFilter(){brand='';search.value='';render()}async function show(id){
  let p=products.find(x=>String(x.id)===String(id));
  if(!p){
    console.error("Producto no encontrado:",id);
    return;
  }

  let fotos=[];
  if(p.image) fotos.push(p.image);

  try{
    const r=await fetch(
      SUPABASE_URL+"/rest/v1/product_images?select=image_path,sort_order&product_id=eq."+encodeURIComponent(p.id)+"&order=sort_order.asc",
      {
        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":"Bearer "+SUPABASE_KEY
        }
      }
    );

    if(r.ok){
      const extras=await r.json();

      extras.forEach(x=>{
        if(x.image_path && !fotos.includes(x.image_path)){
          fotos.push(x.image_path);
        }
      });
    }
  }catch(e){
    console.warn("No se pudieron cargar las fotos adicionales:",e);
  }

  let galeria="";

  if(fotos.length){
    galeria=`
      <div style="display:flex;flex-direction:column;gap:12px">
        <img id="fotoPrincipal"
             src="${fotos[0]}"
             style="width:100%;max-height:360px;object-fit:contain;background:#0b0b0b;border-radius:12px">

        ${fotos.length>1?`
          <div style="display:flex;gap:8px;overflow-x:auto;padding:4px">
            ${fotos.map(f=>`
              <img src="${f}"
                   onclick="document.getElementById('fotoPrincipal').src='${f}'"
                   style="width:72px;height:72px;object-fit:cover;border-radius:9px;border:1px solid #765922;cursor:pointer;background:#0b0b0b">
            `).join("")}
          </div>
        `:""}
      </div>
    `;
  }

  document.getElementById('detail').innerHTML=`
    ${galeria}

    <div class="brand" style="margin-top:15px">${p.brand||""}</div>

    <h2>${p.name||""}</h2>

    ${p.desc?`
      <p style="color:#ddd;line-height:1.6">
        ${p.desc}
      </p>
    `:""}

    <div class="row">
      <b>Presentación</b>
      <span>${p.ml||"Consultar"}</span>
    </div>

    ${p.family?`
      <div class="row">
        <b>Familia</b>
        <span>${p.family}</span>
      </div>
    `:""}

    ${p.notes?`
      <div class="row">
        <b>Notas</b>
        <span>${p.notes}</span>
      </div>
    `:""}

    ${p.gender?`
      <div class="row">
        <b>Género</b>
        <span>${p.gender}</span>
      </div>
    `:""}

    ${p.duration?`
      <div class="row">
        <b>Rendimiento</b>
        <span>${p.duration}</span>
      </div>
    `:""}

    


  `;

  document.getElementById('detail').insertAdjacentHTML('beforeend',`<button class="btn" onclick="compartirProducto('${p.id}')" style="width:100%;margin-top:14px;">
      📤 COMPARTIR PRODUCTO
    </button>`);

  document.getElementById('modal').style.display='block';
}



document.getElementById('sortProducts').addEventListener('change',function(){
  sortMode=this.value;
  render();
});

document.getElementById('brandFilter').addEventListener('change',function(){
  brand=this.value;
  render();
});

function actualizarMarcas(){
  const select=document.getElementById('brandFilter');
  const actual=select.value;

  const marcas=[...new Set(
    products
      .map(p=>(p.brand||'').trim())
      .filter(Boolean)
  )].sort((a,b)=>a.localeCompare(b,'es'));

  select.innerHTML='<option value="">🏷️ Todas las marcas</option>';

  marcas.forEach(m=>{
    const option=document.createElement('option');
    option.value=m;
    option.textContent=m;
    select.appendChild(option);
  });

  if(marcas.includes(actual)) select.value=actual;
}

search.addEventListener("input", function(){
  render();
});

render();
actualizarMarcas();
function hide(id){
  const el=document.getElementById(id);
  if(el) el.style.display='none';
}

async function compartirProducto(id){
  const p=products.find(x=>String(x.id)===String(id));

  if(!p){
    alert("No se encontró el producto.");
    return;
  }

  const url="https://fersolis178-lang.github.io/santino-aromas-web/catalogo.html?producto="+encodeURIComponent(p.id);

  const texto="Mirá este producto de Santino Aromas: "+p.name;

  if(navigator.share){
    try{
      await navigator.share({
        title:p.name+" | Santino Aromas",
        text:texto,
        url:url
      });
      return;
    }catch(e){
      if(e && e.name==="AbortError") return;
    }
  }

  try{
    await navigator.clipboard.writeText(url);
    alert("🔗 Enlace copiado. Ya podés compartirlo.");
  }catch(e){
    window.prompt("Copiá este enlace para compartir:",url);
  }
}

</script>
<script>
const SUPABASE_URL = "https://qxrudlonkxhxxnnwdalo.supabase.co";
const SUPABASE_KEY = "sb_publishable_UbIYMOR680JtOk8fxNmQ-g_1g3wpadx";

async function cargarCatalogoSupabase() {
  try {
    const respuesta = await fetch(
      SUPABASE_URL + "/rest/v1/products?select=id,name,brand,presentation,image_path,description,active,stock,created_at&active=eq.true&order=created_at.desc",
      {
        headers: {
          "apikey": SUPABASE_KEY,

      }

    if (!respuesta.ok) {
      throw new Error("HTTP " + respuesta.status);

    const datos = await respuesta.json();

    products = datos.map(p => ({
      id: String(p.id),
      name: p.name || "",
      brand: p.brand || "",
      ml: p.presentation || "",
      family: "",
      notes: "",
      gender: "",
      duration: "",

      image: p.image_path || "",
      stock: Number(p.stock) || 0,
      created_at: p.created_at || ""
    }));

    actualizarMarcas();
    render();

    // Abrir automáticamente un producto recibido por enlace compartido
    const productoCompartido = new URLSearchParams(window.location.search).get("producto");

    if(productoCompartido){
      const productoEncontrado = products.find(
        x => String(x.id) === String(productoCompartido)
      );

      if(productoEncontrado){
        setTimeout(()=>{
          show(productoEncontrado.id);
        },300);
      }else{
        console.warn("Producto compartido no encontrado:", productoCompartido);
      }
    }

    console.log("Santino Aromas: catálogo cargado desde Supabase:", products.length);
  } catch (error) {
    console.error("No se pudo cargar el catálogo desde Supabase:", error);
  }
}

cargarCatalogoSupabase();
