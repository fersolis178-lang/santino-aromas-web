<script>
const defaults=[{id:1,name:'Asad',brand:'Lattafa',ml:'100 ml',price:49900,family:'Amaderada / especiada',notes:'Especias · maderas · ámbar · vainilla',gender:'Masculino / unisex',duration:'Alta',desc:'Fragancia intensa y especiada, de carácter elegante y envolvente.',image:''},{id:2,name:'Khamrah',brand:'Lattafa',ml:'100 ml',price:52900,family:'Ámbar / gourmand',notes:'Canela · dátiles · praliné · vainilla · ámbar',gender:'Unisex',duration:'Alta',desc:'Dulce, cálido y gourmand.',image:''},{id:3,name:'Yara',brand:'Lattafa',ml:'100 ml',price:45900,family:'Floral / gourmand',notes:'Frutas · flores · vainilla · almizcle',gender:'Femenino',duration:'Media-alta',desc:'Dulce, cremoso y femenino.',image:''},{id:4,name:'Afeef',brand:'Lattafa',ml:'100 ml',price:48900,family:'Floral / frutal',notes:'Frutas · flores · vainilla · maderas',gender:'Unisex',duration:'Alta',desc:'Una fragancia sofisticada y envolvente.',image:''}];
let products=JSON.parse(localStorage.getItem('santinoProducts')||'null')||defaults,cart=[],brand='',editing=null;
let sortMode='default';const grid=document.getElementById('grid'),search=document.getElementById('search');const money=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(n);function persist(){localStorage.setItem('santinoProducts',JSON.stringify(products))}function render(){
  let q=search.value.toLowerCase();

  let a=products.filter(p=>
    (p.name+' '+p.brand+' '+(p.notes||'')+' '+(p.desc||'')).toLowerCase().includes(q) &&
    (!brand||p.brand===brand)
  );

  if(sortMode==='priceAsc') a.sort((x,y)=>Number(x.price)-Number(y.price));
  if(sortMode==='priceDesc') a.sort((x,y)=>Number(y.price)-Number(x.price));
  if(sortMode==='newest') a.sort((x,y)=>new Date(y.created_at||0)-new Date(x.created_at||0));
  if(sortMode==='oldest') a.sort((x,y)=>new Date(x.created_at||0)-new Date(y.created_at||0));

  grid.innerHTML=a.map(p=>`<article class="card"><div class="pic">${p.image?`<img src="${p.image}" loading="lazy">`:'<div class="placeholder">🧴<br>Sin foto</div>'}</div><div class="body"><div class="brand">${p.brand}</div><div class="name">${p.name}</div><div class="ml">${p.ml}</div><div class="price">${money(p.price)}</div><button class="btn detail" onclick="show('${p.id}')">VER DETALLES →</button></div></article>`).join('')||'<p>No encontramos productos.</p>'}function setBrand(b){brand=b;render();document.getElementById('catalogo').scrollIntoView({behavior:'smooth'})}function clearFilter(){brand='';search.value='';render()}async function show(id){
  let p=products.find(x=>String(x.id)===String(id));
  if(!p){
    console.error("Producto no encontrado:",id);
    return;
  }

  let fotos=[];
  if(p.image) fotos.push(p.image);

  try{
    const r=await fetch(
      SUPABASE_URL+"/rest/v1/product_images?select=image_path,sort_order&product_id=eq."+encodeURIComponent(p.id)+"&order=sort_order.asc",
      {
        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":"Bearer "+SUPABASE_KEY
        }
      }
    );

    if(r.ok){
      const extras=await r.json();

      extras.forEach(x=>{
        if(x.image_path && !fotos.includes(x.image_path)){
          fotos.push(x.image_path);
        }
      });
    }
  }catch(e){
    console.warn("No se pudieron cargar las fotos adicionales:",e);
  }

  let galeria="";

  if(fotos.length){
    galeria=`
      <div style="display:flex;flex-direction:column;gap:12px">
        <img id="fotoPrincipal"
             src="${fotos[0]}"
             style="width:100%;max-height:360px;object-fit:contain;background:#0b0b0b;border-radius:12px">

        ${fotos.length>1?`
          <div style="display:flex;gap:8px;overflow-x:auto;padding:4px">
            ${fotos.map(f=>`
              <img src="${f}"
                   onclick="document.getElementById('fotoPrincipal').src='${f}'"
                   style="width:72px;height:72px;object-fit:cover;border-radius:9px;border:1px solid #765922;cursor:pointer;background:#0b0b0b">
            `).join("")}
          </div>
        `:""}
      </div>
    `;
  }

async function compartirProducto(id){
  const p=products.find(x=>String(x.id)===String(id));

  if(!p){
    alert("No se pudo encontrar el producto.");
    return;
  }

  const url="https://fersolis178-lang.github.io/santino-aromas-web/?producto="+encodeURIComponent(p.id);

  const texto=
    "🌸 Santino Aromas\n"+
    "🧴 "+(p.name||"Producto")+"\n"+
    (p.brand?"🏷️ "+p.brand+"\n":"")+
    "💰 "+money(p.price||0)+"\n"+
    (p.ml?"📦 "+p.ml+"\n":"")+
    "\nMirá este producto 👇\n"+
    url;

  try{

    if(p.image && navigator.share){

      try{
        const respuesta=await fetch(p.image);

        if(respuesta.ok){

          const blob=await respuesta.blob();

          const extension =
            blob.type==="image/png" ? "png" :
            blob.type==="image/webp" ? "webp" :
            "jpg";

          const archivo=new File(
            [blob],
            (p.name||"producto").replace(/[^a-z0-9]/gi,"_")+"."+extension,
            {type:blob.type || "image/jpeg"}
          );

          const datos={
            title:"Santino Aromas - "+(p.name||"Producto"),
            text:texto,
            files:[archivo]
          };

          if(!navigator.canShare || navigator.canShare(datos)){
            await navigator.share(datos);
            return;
          }
        }
      }catch(error){
        console.warn("No se pudo compartir la imagen:",error);
      }
    }

    if(navigator.share){
      await navigator.share({
        title:"Santino Aromas - "+(p.name||"Producto"),
        text:texto,
        url:url
      });
      return;
    }

    try{
      await navigator.clipboard.writeText(texto);
      alert("✅ Datos y enlace del producto copiados.");
    }catch(e){
      prompt("Copiá este enlace:",url);
    }

  }catch(e){

    if(e.name!=="AbortError"){
      console.warn("No se pudo compartir:",e);

      try{
        await navigator.clipboard.writeText(texto);
        alert("✅ Datos y enlace del producto copiados.");
      }catch(error){
        prompt("Copiá este enlace:",url);
      }
    }
  }
}

function add(id){
  let p=products.find(x=>String(x.id)===String(id));

  if(!p || Number(p.stock)<=0){
    let toast=document.getElementById('cartToast');
    toast.textContent='❌ Producto agotado';
    toast.classList.add('show');
    clearTimeout(window.cartToastTimer);
    window.cartToastTimer=setTimeout(()=>{
      toast.classList.remove('show');
    },2500);
    return;
  }

  let cantidadEnCarrito=cart.filter(x=>String(x)===String(id)).length;

  if(cantidadEnCarrito >= Number(p.stock)){
    let toast=document.getElementById('cartToast');
    toast.textContent='⚠️ No hay más unidades disponibles';
    toast.classList.add('show');
    clearTimeout(window.cartToastTimer);
    window.cartToastTimer=setTimeout(()=>{
      toast.classList.remove('show');
    },2500);
    return;
  }

  cart.push(String(id));
  document.getElementById('count').textContent=cart.length;
  let countFloat=document.getElementById('countFloat');
  if(countFloat) countFloat.textContent=cart.length;

  let toast=document.getElementById('cartToast');
  toast.textContent='🛒 ¡Agregado al pedido! '+p.name;
  toast.classList.add('show');
  clearTimeout(window.cartToastTimer);
  window.cartToastTimer=setTimeout(()=>{
    toast.classList.remove('show');
  },2500);

            <b>${money(p.price*n)}</b>
            <button class="btn" onclick="add('${id}');openCart()" style="padding:5px 10px">+</button>
            <button class="btn" onclick="removeProduct('${id}')" style="padding:5px 10px">🗑️</button>

        </div>`;

function removeOne(id){
  let i=cart.indexOf(String(id));
  if(i!==-1) cart.splice(i,1);

  document.getElementById('count').textContent=cart.length;
  let countFloat=document.getElementById('countFloat');
  if(countFloat) countFloat.textContent=cart.length;
  openCart();
}

function removeProduct(id){
  cart=cart.filter(x=>String(x)!==String(id));

  document.getElementById('count').textContent=cart.length;
  let countFloat=document.getElementById('countFloat');
  if(countFloat) countFloat.textContent=cart.length;
  openCart();
}
